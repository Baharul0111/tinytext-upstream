[project]
name = "tinytext"
version = "0.1.0"
description = "A very small collection of text helpers."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinytext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
